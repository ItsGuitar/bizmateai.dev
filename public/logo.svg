<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Accent Bolt Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner Subtle Border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="12" />

  <!-- Stylized "B" + AI Sparkle / Radar Icon Element -->
  <g filter="url(#glow)">
    <!-- Main "B" Monogram -->
    <path
      d="M152 116 H272 C338 116 384 152 384 212 C384 246 364 274 332 288 C374 304 396 338 396 380 C396 448 344 484 272 484 H152 C138 484 128 474 128 460 V140 C128 126 138 116 152 116 Z M208 176 V264 H268 C304 264 326 244 326 218 C326 192 304 176 268 176 Z M208 324 V424 H272 C312 424 338 402 338 372 C338 342 312 324 272 324 Z"
      fill="#FFFFFF"
    />

    <!-- AI Cyan Sparkle Dot (Top Right) -->
    <circle cx="396" cy="116" r="38" fill="url(#sparkGrad)" />
    <path d="M396 86 L404 108 L426 116 L404 124 L396 146 L388 124 L366 116 L388 108 Z" fill="#FFFFFF" />
  </g>
</svg>
